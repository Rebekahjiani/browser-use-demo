              - list
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Do not want to carry a cumbersome telescope while wandering in beautiful nature? Single Hand Focus Monocular Telescope, Lightweight(0.61 pounds, only about 2 battery(D)) makes it more comfortable to use with only one hand, both hold and adjust focus. Also, the durable rubber armor with stripes offers a slip-free grip, avoid thosee unnecessary acciden"
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "80X100 High Power Magnification Monocular Telescope- Have the best view in your outdoor adventures. To see 12X closer with a clear and bright image with the generous, light-gathering 50mm objective wide lens. Perfect for Hiking,Hunting,Climbing,Birdwatching, Ball games,Watching Wildlife and Scenery."
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Comes with a Gosky 2020 newest quick alignment smartphone adapter mount.Compatible with smartphone 12Pro Max, 12 Pro, 12, 12mini, 11Pro Max, 11 Pro,11, SE, Xs,Xr, X, 8 plus, 8, 7plus,7, 6plus, 6,5s,5, 4s, Samsung M30, S20, S20+,S20FE, S10, S10+, S10E, S8, S7, S6, S5, S4, Note20, Note20 Ultra, Note, A51,A71,A70, LG, HTV, Sony, and much more."
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Large BAK4 Prism inside and Fully Multi-coated(FMC) Lens Coating - s, light transmittance reaches up to 99.5%, delivers more light to the view, reduces chromatic aberration and ghost images, give you clearer, brighter and more colorful view."
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Solid Framework and shock-absorbing Rubber Armor with Stripes -Its tight fitting protection makes it usable to withstand the toughest weather conditions. And The rubber armor with stripes makes it comfortable for use and keeps it from slipping out from your hand."
                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Waterproof, Dust-proof, and Shockproof Design: Nitrogen-filled waterproof and O-ring sealed optics prevent moisture, dust and debris and ensures the living waterproof function."
