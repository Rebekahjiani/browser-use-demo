                - listitem [level=1]
                  - ListMarker "•"
                  - StaticText "Tony Chacheres More Spice Cajun Seasoning offers a hotter / spicier blend of Cajun seasoning, without adding a salty taste to your Cajun food. Tony Chacheres found that people were adding more of the Tony Chacheres Original Cajun Seasoning to their food for a spicer taste. These customers were complaining that their food was too salty! Hence, Tony Chacheres came out with a spicier blend of the Tony Chacheres Original Cajun Seasoning."
