                - generic [ref=e215]:
                  - list [ref=e217]:
                    - listitem [ref=e218]: This Certified Refurbished product is tested and certified to look and work like new. The refurbishing process includes functionality testing, basic cleaning, inspection, and repackaging. The product ships with all relevant accessories, a minimum 90-day warranty, and may arrive in a generic box. Only select sellers who maintain a high-performance bar may offer Certified Refurbished products on Amazon.com.
                    - listitem [ref=e219]: 【Plug & Play Simplify PoE installation】 power over Ethernet means the IP cameras connect to the NVR with a single cable that transmits both data and power, no need to connect power cable, lower risk of electric leakage and easy to set up. This literally simplified the installation and reduced costs.
                    - listitem [ref=e220]: 【Stable & Lossless Video Quality】Unlike CCTV DVR system, videos from the IP camera system will not be degraded or destroyed by cables. The digital signal will keep real 2mp high definition image via 300ft CAT6 ethernet cables. You will have no worry about the coaxial cable quality for DVR and analog cameras that will affect much on its image, even within 100ft.
                    - listitem [ref=e221]: 【5MP NVR & Expandable PoE Security camera system】-This is 8Channel 5MP NVR Recorder, It provides you the flexibility to extend additional cameras. You can add more 4pcs 1080P or 5MP Bullet or Dome PoE Cameras.
                    - listitem [ref=e222]: 【No Include Hard Drive】--This system does not come with hard drive. Assembling a 3.5 inch SATA 500GB to 2TB hard drive is necessary. DVR can be set to automatically overwrite the oldest internally stored footage or you can transfer those video files by USB to a memory stick or external hard drive.
